<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Character Counter</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    width:400px;
    padding:30px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px gray;
}

h1{
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:120px;
    padding:10px;
    font-size:16px;
    resize:none;
    border:2px solid gray;
    border-radius:5px;
}

p{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Live Character Counter</h1>

<textarea id="text" placeholder="Type something..."></textarea>

<p>Characters: <span id="count">0</span></p>

</div>

<script>

const text=document.getElementById("text");
const count=document.getElementById("count");

text.addEventListener("input",function(){

count.textContent=text.value.length;

});

</script>

</body>
</html>
